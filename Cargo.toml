[package]
name = "AliveBot"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1.0.104"
bimap = "0.6.3"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
emojito = "0.3.5"
ffmpeg-sidecar = "2.5.2"
nagisa = { version = "0.12.0", default-features = false, features = ["onebot"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
whisper-rs = { version = "0.16.0", default-features = false, features = ["tracing_backend"] }
